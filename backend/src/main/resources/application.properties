spring.application.name=Hospital-ERP

# ===============================
# DATABASE CONFIGURATION
# Render/Railway MySQL environment variables with persistent file-based H2 fallback
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${DATABASE_URL:${MYSQLURL:jdbc:h2:file:./data/hospitaldb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:sa}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER CONFIGURATION
# Render supplies PORT automatically
# ===============================

server.port=${PORT:8080}